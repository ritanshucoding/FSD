<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap CSS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-4">
        <h2>TITLE</h2>

         <div class="row mt-3"> <!-- margin top 3 -->
            <div class="col-4 bg-light border">B1</div>
            <div class="col-4 bg-light border">B2</div>
            <div class="col-4 bg-light border">B3</div>
        </div>

        <div class="row mt-3">
            <div class="col-3 bg-secondary text-white border">B4</div>
            <div class="col-3 bg-secondary text-white border">B5</div>
            <div class="col-3 bg-secondary text-white border">B6</div>
            <div class="col-3 bg-secondary text-white border">B7</div>
        </div>

        <div class="row mt-3">
            <div class="col-4 bg-info text-white border">B8</div>
            <div class="col-4 bg-info text-white border">B9</div>
            <div class="col-4 bg-info text-white border">B10</div>
        </div>

        <footer class="mt-4">
            <h2>FOOTER</h2>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

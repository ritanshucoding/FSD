<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }
        .search {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }
        .search h1 {
            margin-top: 0;
        }
        input {
            width: 70%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 12px 20px;
            margin-left: 5px;
            background-color: #24292e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #444;
        }.profile {
            margin-top: 30px;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }
        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }
        .profile h2 {
            margin-bottom: 5px;
        }
        .bio {
            color: #555;
        }
        .info {
            text-align: left;
            margin-top: 20px;
        }
        .info p {
            font-size: 17px;
        }
        .github-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #24292e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .error {
            color: red;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search">
            <h1>GitHub Profile Finder</h1>
            <input
                type="text"
                id="usernameInput"
                placeholder="Enter GitHub username"
            >
            <button onclick="getProfile()">
                Fetch Profile
            </button>
            <p id="error" class="error"></p>
        </div>
        <div class="profile">
            <img
                id="avatar"
                src=""
                alt="GitHub Profile"
            >
            <h2 id="name">
                GitHub Profile
            </h2>
            <p id="bio" class="bio">
                Enter a GitHub username above
            </p>
            <div class="info">
                <p>
                    👤 Username:
                    <span id="username"></span>
                </p>
                <p>
                    📍 Location:
                    <span id="location"></span>
                </p>
                <p>
                    📦 Public Repositories:
                    <span id="repos"></span>
                </p>
                <p>
                    👥 Followers:
                    <span id="followers"></span>
                </p>
                <p>
                    👥 Following:
                    <span id="following"></span>
                </p>
            </div>
            <a
                id="githubLink"
                class="github-link"
                href="#"
                target="_blank"
            >
                Visit GitHub Profile
            </a>
        </div>
    </div>
    <script>
        async function getProfile() {
            const username =
                document.getElementById(
                    "usernameInput"
                ).value.trim();
            if (username === "") {
                document.getElementById("error").innerText =
                    "Please enter a GitHub username";

                return;
            }
            document.getElementById("error").innerText =
                "";
            const URL =
                `https://api.github.com/users/${username}`;

            try {
                console.log("Fetching:", URL);
                const response =
                    await fetch(URL);
                console.log(
                    "Response:",
                    response
                );
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error(
                            "GitHub user not found"
                        );
                    }
                    if (response.status === 403) {
                        throw new Error(
                            "GitHub API rate limit exceeded"
                        );
                    }
                    throw new Error(
                        `Error: ${response.status}`
                    );
                }
                const data =
                    await response.json();
                console.log(
                    "GitHub Data:",
                    data
                );
                document.getElementById("avatar").src =
                    data.avatar_url;
                document.getElementById("name").innerText =
                    data.name || "No Name";
                document.getElementById("bio").innerText =
                    data.bio || "No Bio Available";
                document.getElementById("username").innerText =
                    data.login;
                document.getElementById("location").innerText =
                    data.location || "Not Available";
                document.getElementById("repos").innerText =
                    data.public_repos;
                document.getElementById("followers").innerText =
                    data.followers;
                document.getElementById("following").innerText =
                    data.following;
                document.getElementById("githubLink").href =
                    data.html_url;
            }
            catch (error) {
                console.error(
                    "Error:",
                    error
                );
                document.getElementById("error").innerText =
                    error.message;
            }
        }
    </script>
</body>

</html>

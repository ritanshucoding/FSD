<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM-5</title>
    <style>
        #container{
            align-items: center;
            justify-content: center;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>College Wallah</h1>
    </div>
    <div id="old">
        <h1 id="main"> Ritanshu Tiwari</h1>
    </div>
    <div id="new">
        <h1 id =main2> Ritanshu Tiwari</h1>
    </div>
    <button onclick="fun()">Add Element</button>
    <button onclick="fun1()">Remove Element</button>
    <button onclick="fun2()">Replace Element</button>
    <script>
        const h1=document.getElementById("h1"); // Get the element with id "h1"
        function fun(){
            const h2=document.createElement("h2"); // Create a new h2 element
            h2.textContent="College Wallah"; // Set the text content of the new h2 element
             container.append("Hello",h2); // Append the text "Hello" and the new h2 element as children of the container
            // container.appendChild(h2); // Append the new h2 element as a child of the container
            // container.prepend(h2); // Prepend the new h2 element as the first child of the container

        }
        function fun1(){
            const old=document.getElementById("main");
             old.remove(); // Remove the element with id "main" from the DOM
            // old.parentNode.removeChild(old); // Remove the element with id "main" from its parent node
        }

        function fun2(){
            const new1=document.getElementById("main2");
            const old=document.getElementById("main");
             new1.replaceWith(old); // Replace the element with id "main2" with the element with id "main"
            // old.parentNode.replaceChild(new1,old); // Replace the element with id "main" with the element with id "main2" in its parent node
        }
    </script>
</body>
</html>

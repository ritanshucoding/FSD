    <meta charset="UTF-8">

    <title>Document</title>

<body>
    <h1 id="heading"> Document Object Model</h1>
    <p class="info"> This is para</p>
    <h2 class="info"> This is heading 2</h2>
    <b class="info">This is bold text</b>
    <div class="main"> <span> Hello good morning</span>
    </div>
    <button onclick="changeText()">Click me</button>
    <form>
        <input type"text" name="para">
        <input type="email" name="para" id="">
    </form>
    <script>
        var ele=document.getElementsByName("para"); // getElementsByName
        function changeText(){
            for(var i=0;i<ele.length;i++){
                ele[i].textContent="Text changed!"; // Change the text of all elements with name "para"
                ele[i].style.backgroundColor="yellow"; // Change background color of all elements with name "para"
            }
        }

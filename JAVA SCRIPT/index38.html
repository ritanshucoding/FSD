<!-- List Delegation -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>
    <script>
        const list=document.getElementById("list")
        list.addEventListener("click",function(event){ // Add an event listener to the list for the "click" event
            if(event.target.tagName==="LI"){ // Check if the clicked element is a list item (LI)
                console.log(event.target.textContent); // Log the text content of the clicked list item to the console
            }
        });
    </script>
</body>
</html>

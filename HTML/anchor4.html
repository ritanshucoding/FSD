<!-- Anchor Tag is mainly used for link one element of the code to the another element. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor tags</title>
</head>
<body>
    <!-- ANCHOR TAGS -->
    <a href="https://www.netflix.com/in/">Netflix</a>
    <hr>
    <a href="https://www.youtube.com/">Youtube</a>

</body>
</html>

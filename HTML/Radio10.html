<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio</title>
</head>
<body>
    <!--  CHECK BOX (TERM & CONDITION LIKE OPTION) -->
    <form action="/server">
        <input type="checkbox" id="age" name="age">
        <lable for="age">I am 18+</lable>
        
        <!-- RADIO BOX (SELECT ONLY ONE OPTION) -->
        <div>
            <input type="radio" name="Fruit" id="apple" value="apple">
            <lable for="apple">Apple</lable>
            <input type="radio" name="Fruit" id="Banana" value="Banana">
            <lable for="Banana">Banana</lable>
            <input type="radio" name="Fruit" id="Orange" value="Orange">
            <lable for="Orange">Orange</lable>
            
            <!-- Choose your profession(Radio Box) -->
             Choose Your Profession
            <select name="Profession" id="Profession">
                <option>Select Your Option</option>
                <option value="Stu" id="Student">Student</option>
                <option value="Dev" id="Developer">Developer</option>
            </select>
        </div>
         
          <button>Submit</button>
        
    </form>
</body>
</html>

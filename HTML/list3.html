<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in HTML</title>
</head>
<body>
    <!-- UNORDERED LIST -->
    <ul type="circle"><h2>Want to Buys</h2>
        <li>Bread</li>
        <li>Jam</li>
        <li>Frooti</li>
        <li>Samosa</li>
    </ul>
    <!-- ORDERED LIST -->
     <h2 style="text-align:center;">Want to Buys</h2>

<ol type="A" start="11" style="list-style-position: inside; text-align: center;">
    <li>Bread</li>
    <li>Jam</li>
    <li>Frooti</li>
    <li>Samosa</li>
</ol>

     <!-- UNORDERED LIST -->

     <ul><h2>WANT TO BUYS</h2>
    <li>Macbook</li>
<li>Window</li>
<li>Iphone</li></ul>

<!-- ORDERED LIST -->
 <ol type="1"><h2>
    I WANT
 </h2>
 <li>Mango</li>
 <li>Apple</li>
 <li>Grapes</li>

 </oltype>
</body>
</html>

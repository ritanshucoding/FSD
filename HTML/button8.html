<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button</title>
</head>
<body>
    <!--  LABEL -->
    <form action="/action">
        <div>
        <label for="Username">Username :</label>
            <input type="text" placeholder="enter username" id="username"/>
        </div>
        <br />
        <div>
        <label for="password">Password : </label>
            
        <input type="password" placeholder="password" id="password"/>
    </div>
    <br>
        <div>
            <label for="age">Age :</label>
            <input type="age" placeholder="age" id="age">
        </div>
        <br>
        <div>
            <!--  OPTIONAL LIKE (CHOISE YOUR PFOFESSION) -->
            Choose your profession
            <select name="Profession" id="Profession">
                <option>Select Your Option</option>
                <option value="Stu" id="Student">Student</option>
                <option value="Dev" id="Developer">Developer</option>
            </select>
          </div>  
          <br>
       <!-- RANGE (LIKE VOLUME BUTTON) -->
       <label for="vol">Select your Volume : </label>
       <input type="range" id="vol "/>
       <br>
       <!-- TEXT AREA  -->
        <label for="feedback"> Please give your feedback :</label>
        <textarea id="feedback"></textarea>
    
    <!-- BUTTON  -->
     <button type="Submit">Submit</button>
     <button type="reset">Reset</button>
     <!--  BUTTON OPTIONAL -->
       <br>
       <input type="submit">
       <input type="submit" value="click for submit">
       
       <br>
       
</form>

</body>
</html>
